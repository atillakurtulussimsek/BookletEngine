[build-system]
requires = ["setuptools>=68.0", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "booklet-engine"
version = "1.0.0"
description = "Production-grade PDF publishing automation engine for personalized student booklet creation"
readme = "README.md"
license = {text = "MIT"}
requires-python = ">=3.10"
authors = [{name = "Booklet Engine Team"}]

dependencies = [
    "PyMuPDF>=1.23.0",
    "pikepdf>=8.0.0",
    "reportlab>=4.0",
    "pydantic>=2.0",
    "rich>=13.0",
    "click>=8.1",
]

[project.optional-dependencies]
dev = [
    "pytest>=7.0",
    "pytest-cov>=4.0",
]

[project.scripts]
booklet-engine = "src.cli:main"

[tool.setuptools.packages.find]
where = ["."]

[tool.pytest.ini_options]
testpaths = ["tests"]
